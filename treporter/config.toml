# ChronoPulse Project Configuration

[project]
name = "treporter"
description = "TReporter project"

[date_range]
default_period = "current_month"

[collection]
include_diffs = false
max_diff_size = 10000

[data_sources]

# Repositories to analyze
[[repositories]]
name = "treporter"
platform = "local"
path = "/Users/ndd/apps/tasksontime"
include_commits = true
branches = "all"

[llm]
provider = "ollama"
model = "llama3.2"
api_key_env = "OPENAI_API_KEY"
max_tokens = 4000
temperature = 0.7

[templates]

[templates.monthly_report]
path = "templates/monthly_report.md"
output_format = "markdown"
sections = ["summary", "accomplishments", "metrics", "challenges", "next_steps"]

[templates.group_slides]
path = "templates/group_slides.md"
output_format = "marp"
sections = ["highlights", "metrics", "status", "priorities"]

[output]
base_directory = "./reports"
date_format = "%Y-%m"
filename_template = "{project}_{type}_{date}"
